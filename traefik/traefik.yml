# Static Traefik configuration. Routes live in dynamic/ (file provider, no Docker socket).
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
    transport:
      respondingTimeouts:
        # Cold model loads can take a while on the first request.
        readTimeout: 10m
        writeTimeout: 10m

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true

ping: {}

api:
  dashboard: false

log:
  level: INFO

accessLog:
  fields:
    headers:
      defaultMode: drop

metrics:
  prometheus:
    addRoutersLabels: true
