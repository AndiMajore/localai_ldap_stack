# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# Applied automatically by the Authentik worker (mounted at /blueprints/custom).
# Values come from the container environment via !Env (see docker-compose.yml).
version: 1
metadata:
  name: Embedder stack - LDAP source + LocalAI OIDC app
entries:
  # ---------------------------------------------------------------- LDAP ---
  # Attribute mappings. The attribute names come from .env, so the same blueprint
  # serves OpenLDAP (uid / cn) and Active Directory (sAMAccountName / displayName).
  - model: authentik_sources_ldap.ldapsourcepropertymapping
    id: map-username
    identifiers:
      name: "Embedder stack: LDAP username"
    attrs:
      expression: !Format ['return {"username": ldap.get("%s")}', !Env [LDAP_USERNAME_ATTRIBUTE, uid]]
  - model: authentik_sources_ldap.ldapsourcepropertymapping
    id: map-name
    identifiers:
      name: "Embedder stack: LDAP name"
    attrs:
      expression: !Format ['return {"name": ldap.get("%s")}', !Env [LDAP_NAME_ATTRIBUTE, cn]]
  - model: authentik_sources_ldap.ldapsourcepropertymapping
    id: map-mail
    identifiers:
      name: "Embedder stack: LDAP mail"
    attrs:
      expression: !Format ['return {"email": ldap.get("%s")}', !Env [LDAP_MAIL_ATTRIBUTE, mail]]

  - model: authentik_sources_ldap.ldapsource
    id: ldap-source
    identifiers:
      slug: openldap
    attrs:
      name: LDAP directory
      enabled: true
      server_uri: !Env LDAP_URL
      start_tls: !Env [LDAP_START_TLS, "false"]
      bind_cn: !Env LDAP_BIND_DN
      bind_password: !Env LDAP_BIND_PASSWORD
      base_dn: !Env LDAP_BASE_DN
      additional_user_dn: !Env [LDAP_USER_DN, ou=people]
      additional_group_dn: !Env [LDAP_GROUP_DN, ou=groups]
      user_object_filter: !Env [LDAP_USER_FILTER, (objectClass=inetOrgPerson)]
      group_object_filter: !Env [LDAP_GROUP_FILTER, (objectClass=groupOfNames)]
      group_membership_field: !Env [LDAP_GROUP_MEMBERSHIP_FIELD, member]
      user_membership_attribute: distinguishedName
      object_uniqueness_field: !Env [LDAP_UNIQUENESS_FIELD, entryUUID]
      sync_users: true
      sync_groups: true
      # Never write passwords back into LDAP; LDAP stays the source of truth.
      sync_users_password: false
      password_login_update_internal_password: false
      delete_not_found_objects: true
      user_property_mappings:
        - !Find [authentik_sources_ldap.ldapsourcepropertymapping, [managed, goauthentik.io/sources/ldap/default-dn-path]]
        - !KeyOf map-username
        - !KeyOf map-name
        - !KeyOf map-mail
      group_property_mappings:
        - !Find [authentik_sources_ldap.ldapsourcepropertymapping, [managed, goauthentik.io/sources/ldap/openldap-cn]]

  # ------------------------------------------------------- OIDC for LocalAI ---
  # LocalAI only honours verified emails (e.g. for LOCALAI_ADMIN_EMAIL). Emails come
  # from LDAP, which is authoritative here, so mark them verified.
  - model: authentik_providers_oauth2.scopemapping
    id: scope-email-verified
    identifiers:
      name: "Embedder stack: email (LDAP, verified)"
    attrs:
      scope_name: email
      description: Email address
      expression: |
        return {
            "email": request.user.email,
            "email_verified": bool(request.user.email),
        }

  - model: authentik_providers_oauth2.oauth2provider
    id: localai-provider
    identifiers:
      name: localai
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: localai
      client_secret: !Env LOCALAI_OIDC_CLIENT_SECRET
      grant_types:
        - authorization_code
        - refresh_token
      redirect_uris:
        - matching_mode: strict
          url: !Format ["%s://ai.%s/api/auth/oidc/callback", !Env [PUBLIC_SCHEME, https], !Env DOMAIN]
          redirect_uri_type: authorization
      issuer_mode: per_provider
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !KeyOf scope-email-verified

  - model: authentik_core.application
    id: localai-app
    identifiers:
      slug: localai
    attrs:
      name: Embedding & Decision API
      provider: !KeyOf localai-provider
      meta_launch_url: !Format ["%s://ai.%s/", !Env [PUBLIC_SCHEME, https], !Env DOMAIN]
      meta_description: Embeddings, reranking and decision models. Log in to manage your API keys.
      policy_engine_mode: any

  # Earlier versions of this blueprint used a fixed group name; remove that policy.
  - model: authentik_policies_expression.expressionpolicy
    state: absent
    identifiers:
      name: "Embedder stack: require ai-api-users"

  # Only members of the LDAP group API_USERS_GROUP (default "ai-api-users") may use the application.
  # An expression policy (instead of a group binding) does not depend on the
  # group object existing before the first LDAP sync.
  - model: authentik_policies_expression.expressionpolicy
    id: require-ai-api-users
    identifiers:
      name: "Embedder stack: require API users group"
    attrs:
      expression: !Format ['return ak_is_group_member(request.user, name="%s")', !Env [API_USERS_GROUP, ai-api-users]]

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf localai-app
      policy: !KeyOf require-ai-api-users
    attrs:
      order: 0
      enabled: true
      negate: false
      timeout: 30
