# Production override when a reverse proxy on the host (e.g. an Apache vhost) terminates TLS
# and forwards to this stack:
#   docker compose -f docker-compose.yml -f compose.behind-proxy.yml up -d
#
#   client ──https──► Apache :443 (your certificates) ──http──► 127.0.0.1:${TRAEFIK_HTTP_PORT} Traefik ──► stack
#
# Example vhost: apache/embedder-stack.conf.example. The public URLs stay https://, so all
# scheme-dependent settings keep their https defaults; only Traefik changes.

services:
  traefik:
    command: --configFile=/etc/traefik/traefik.behind-proxy.yml
    environment:
      TRAEFIK_TLS: "false"
      PUBLIC_SCHEME: https
    # Replace the 80/443 bindings of docker-compose.yml: Apache owns those ports.
    ports: !override
      - "127.0.0.1:${TRAEFIK_HTTP_PORT:-8081}:80"
    volumes:
      - ./traefik/traefik.behind-proxy.yml:/etc/traefik/traefik.behind-proxy.yml:ro

  authentik-server:
    environment:
      PUBLIC_SCHEME: https

  authentik-worker:
    environment:
      PUBLIC_SCHEME: https

  authentik-blueprint:
    environment:
      PUBLIC_SCHEME: https

  localai:
    environment:
      LOCALAI_BASE_URL: https://ai.${DOMAIN}
      LOCALAI_OIDC_ISSUER: https://auth.${DOMAIN}/application/o/localai/
    # LocalAI fetches the OIDC configuration from https://auth.<domain> at startup and on
    # login. Traefik has no TLS in this mode, so send that call through Apache on the host,
    # which serves the real certificate. (Needs Apache to listen on the Docker bridge too,
    # e.g. *:443, and the host firewall to allow it.)
    extra_hosts:
      - "auth.${DOMAIN}:host-gateway"
